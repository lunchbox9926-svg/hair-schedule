<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6574d9">
  <title>ヘアスケジュール</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="icon">✦</div>
    <div><h1>ヘアスケジュール</h1><p>アッシュブルー半年管理</p></div>
  </header>

  <section class="card hero">
    <label for="start">カラーした日</label>
    <input id="start" type="date">
    <div id="dayCount" class="big">日付を設定してください</div>
    <div id="next" class="sub"></div>
  </section>

  <section class="card">
    <h2>半年の予定</h2>
    <div id="timeline"></div>
  </section>

  <section class="card">
    <h2>カラーバター記録</h2>
    <div class="row">
      <input id="recordDate" type="date">
      <button id="recordBtn">今日のカラーを記録</button>
    </div>
    <div id="history"></div>
  </section>

  <section class="card">
    <h2>基本プラン</h2>
    <p>0〜4か月：色落ちを見ながらアッシュブルーを補充。</p>
    <p>4か月頃：ブリーチ予定ならカラーバターをいったん終了。</p>
    <p>4〜6か月：追加カラー・ブリーチを避けて色落ち期間。</p>
    <p>6か月頃：状態を確認して、必要なら伸びた根元のみブリーチを検討。</p>
  </section>

  <p class="note">記録はこの端末のブラウザ内に保存されます。</p>
</main>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
</body>
</html>
